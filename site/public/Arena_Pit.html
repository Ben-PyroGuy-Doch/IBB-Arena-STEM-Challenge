<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IBB Arena Pit Control</title>

    <style>
      body {
        background-color: #0f0f0f;
        color: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2em;
      }
      h1 {
        color: #f1c40f;
        text-shadow: 1px 1px 4px #000;
        margin-bottom: 30px;
      }
      h2 { color: #f1c40f; }

      button {
        background-color: #e63946;
        color: #f5f5f5;
        font-size: 1.1em;
        padding: 12px 24px;
        margin: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
        transition: all 0.2s ease-in-out;
      }
      button:hover {
        background-color: #f1c40f;
        color: #0f0f0f;
        box-shadow: 0 0 15px #f1c40f;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 800px;
        margin: 0 auto;
      }

      .status {
        margin: 12px auto;
        max-width: 900px;
        padding: 10px 14px;
        border-radius: 8px;
        text-align: left;
        font-family: Consolas, Menlo, monospace;
        background: #1a1a1a;
        border: 1px solid #333;
        white-space: pre-wrap;
        min-height: 48px;
      }
    </style>

    <!-- Role Gate -->
    <script>
      (function gate() {
        const token = sessionStorage.getItem('arenaToken');
        if (!token) location.href = 'index.html';
        try {
          const decoded = JSON.parse(atob(token));
          const expectedRole = 'pit';
          if (decoded.role !== expectedRole) location.href = 'index.html';
        } catch {
          location.href = 'index.html';
        }
      })();
    </script>
  </head>

  <body>
    <img src="assets/ibb-logo.png" alt="IBB Logo"
      style="width: 360px; margin-bottom: 20px; filter: drop-shadow(0 0 10px #e63946);" />

    <h1>Pit Dashboard</h1>

    <div id="status" class="status"></div>

    <div class="button-group">
      <button onclick="PitUp()">Pit Up</button>
      <button onclick="PitDown()">Pit Down</button>
    </div>

    <script>
      // ----- CONFIG -----
      const API_BASE = "http://192.168.0.102:3000";  // Your working API

      const statusBox = document.getElementById('status');

      function setStatus(msg, isError = false) {
        statusBox.style.borderColor = isError ? '#e63946' : '#333';
        statusBox.style.color = isError ? '#e63946' : '#9ee493';
        statusBox.textContent = msg;
      }

      async function PitUp() {
        await callApi("/api/pit-up");
      }

      async function PitDown() {
        await callApi("/api/pit-down");
      }

      async function callApi(path) {
        try {
          setStatus("Calling " + path + " ...");
          const res = await fetch(`${API_BASE}${path}`);
          const text = await res.text();

          if (!res.ok) {
            setStatus(`Error ${res.status}: ${text || 'Request failed'}`, true);
            return;
          }
          setStatus(text || "OK");
        } catch (err) {
          console.error(err);
          setStatus("Network error: " + err, true);
        }
      }

      document.addEventListener("keydown", e => {
        if (e.key === "Enter") PitUp();
      });
    </script>
  </body>
</html>

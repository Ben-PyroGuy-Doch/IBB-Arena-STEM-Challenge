<!DOCTYPE html>
<html>
<head>
  <title>IBB Arena Control</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 3em;
    }
    h2 {
      color: #f1c40f;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 1.2em;
      border: 2px solid #e63946;
      background-color: #1a1a1a;
      color: #f5f5f5;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #e63946;
      color: #f5f5f5;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #f1c40f;
      color: #0f0f0f;
    }
    #pin-error {
      color: #e63946;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <img src="../assets/ibb-logo.png" 
       alt="IBB Logo" 
       style="width: 360px; margin-bottom: 20px; filter: drop-shadow(0 0 10px #e63946);">

  <div id="pin-entry">
    <h2>Enter PIN to Unlock Dashboard</h2>
    <input type="password" id="pinInput" placeholder="Enter PIN" />
    <br>
    <button onclick="verifyPIN()">Unlock</button>
    <p id="pin-error"></p>
  </div>

<script>
  async function verifyPIN() {
    const pin = document.getElementById('pinInput').value.trim();
    const errorEl = document.getElementById('pin-error');
    errorEl.textContent = "";

    if (!pin) {
      errorEl.textContent = "Please enter a PIN.";
      return;
    }

    // IMPORTANT: Your API lives on 192.168.0.102:3000
    const API_BASE = "http://192.168.0.102:3000";

    try {
      const res = await fetch(`${API_BASE}/api/verify-pin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin })
      });

      const text = await res.text();
      let data;

      try {
        data = text ? JSON.parse(text) : {};
      } catch (_) {
        errorEl.textContent = "Server returned invalid response.";
        console.error("Non-JSON response:", text);
        return;
      }

      if (!res.ok) {
        errorEl.textContent = data.error || `Login failed (${res.status})`;
        return;
      }

      if (data.success) {
        // Save token (if needed)
        if (data.token) {
          sessionStorage.setItem("arenaToken", data.token);
        }

        // Role pages live alongside this page in /operator/
        window.location.href = data.page;  // same folder: /operator/
      } else {
        errorEl.textContent = "Incorrect PIN";
      }

    } catch (err) {
      console.error(err);
      errorEl.textContent = "Network error or server unreachable";
    }
  }

  // Allow Enter key
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") verifyPIN();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>IBB Arena Crane Control</title>

  <style>
    body {
      background-color: #0f0f0f;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2em;
    }
    h1 { color: #f1c40f; text-shadow: 1px 1px 4px #000; margin-bottom: 10px; }
    h2 { color: #f1c40f; margin-top: 10px; }
    p  { margin: 6px 0; }

    button {
      background-color: #e63946;
      color: #f5f5f5;
      font-size: 1.1em;
      padding: 12px 24px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
      transition: all 0.2s ease-in-out;
    }
    button:hover {
      background-color: #f1c40f;
      color: #0f0f0f;
      box-shadow: 0 0 15px #f1c40f;
    }

    .button-group {
      display: flex; flex-wrap: wrap; justify-content: center;
      max-width: 900px; margin: 0 auto;
    }

    .control-container { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
    .control-panel, .visual-panel { flex: 1; min-width: 320px; }

    .joystick-container {
      width: 150px; height: 150px; background-color: #333;
      border-radius: 50%; position: relative; margin: 20px auto; overflow: hidden;
    }
    #joystick {
      width: 50px; height: 50px; background-color: #f1c40f; border-radius: 50%;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      cursor: grab; transition: transform 0.1s ease-out;
    }

    .status {
      margin: 12px auto; max-width: 900px; padding: 10px 14px; border-radius: 8px;
      text-align: left; font-family: Consolas, Menlo, monospace; background: #1a1a1a;
      border: 1px solid #333; white-space: pre-wrap; min-height: 48px;
    }
    .pos { color: #9ee493; }
    .small { font-size: 0.9em; color: #bbb; }
  </style>

  <!-- Role Gate (allow 'crane' OR 'root' so you can test as root) -->
  <script>
    (function gate() {
      const token = sessionStorage.getItem('arenaToken');
      if (!token) location.href = 'index.html';
      try {
        const decoded = JSON.parse(atob(token));
        const role = decoded && decoded.role;
        if (role !== 'crane' && role !== 'root') {
          location.href = 'index.html';
        }
      } catch {
        location.href = 'index.html';
      }
    })();
  </script>
</head>

<body>
  <!-- (Optional) Logo -->
  <img src="../assets/ibb-logo.png" alt="IBB" style="width:300px;">

  <h1>Arena Crane Control</h1>
  <div class="small">If buttons don’t respond, click <b>Test API</b> below to verify connectivity.</div>

  <p>Current Position: <span id="cranePosition" class="pos">Loading…</span></p>
  <div id="status" class="status"></div>

  <div class="button-group" style="margin-bottom:4px;">
    <button onclick="testApi()">Test API</button>
  </div>

  <div class="control-container">

    <!-- Left: Buttons -->
    <div class="control-panel">

      <div class="button-group">
        <h2 style="width:100%;">Home & Reset</h2>
        <button onclick="moveCraneHome()">Home</button>
      </div>

      <div class="button-group">
        <h2 style="width:100%;">X-Axis</h2>
        <button onclick="moveCrane('X10')">X +10</button>
        <button onclick="moveCrane('X100')">X +100</button>
        <button onclick="moveCrane('X-10')">X -10</button>
        <button onclick="moveCrane('X-100')">X -100</button>
      </div>

      <div class="button-group">
        <h2 style="width:100%;">Y-Axis</h2>
        <button onclick="moveCrane('Y10')">Y +10</button>
        <button onclick="moveCrane('Y100')">Y +100</button>
        <button onclick="moveCrane('Y-10')">Y -10</button>
        <button onclick="moveCrane('Y-100')">Y -100</button>
      </div>

      <div class="button-group">
        <h2 style="width:100%;">Z-Axis</h2>
        <button onclick="moveCrane('Z10')">Z +10</button>
        <button onclick="moveCrane('Z-10')">Z -10</button>
      </div>

      <div class="button-group">
        <h2 style="width:100%;">Claw</h2>
        <button onclick="craneFire()">Fire</button>
        <button onclick="craneRelease()">Release</button>
      </div>

    </div>

    <!-- Right: Joystick -->
    <div class="visual-panel">
      <div class="joystick-container">
        <div id="joystick"></div>
      </div>
    </div>

  </div>

<script>
  const API_BASE = "http://192.168.0.102:3000";

  const statusBox = document.getElementById('status');
  const posEl     = document.getElementById('cranePosition');

  // Surface any JS errors to the status panel so we don't silently fail
  window.addEventListener('error', (e) => {
    setStatus('JS error: ' + (e.error?.message || e.message || e.filename), true);
  });

  function setStatus(msg, isError = false) {
    statusBox.style.borderColor = isError ? '#e63946' : '#333';
    statusBox.style.color       = isError ? '#e63946' : '#9ee493';
    statusBox.textContent       = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    console.log(msg);
  }

  // --- Connectivity self-test ---
  async function testApi() {
    try {
      setStatus('Testing API /health ...');
      const res = await fetch(`${API_BASE}/health`);
      const txt = await res.text();
      if (!res.ok) return setStatus(`API /health error ${res.status}: ${txt}`, true);
      setStatus('API OK: ' + txt.substring(0, 120) + '...');
    } catch (err) {
      setStatus('API test failed: ' + err, true);
    }
  }

  // ----- Position polling -----
  async function fetchPosition() {
    try {
      const res  = await fetch(`${API_BASE}/api/crane/position`);
      const data = await res.json();
      if (!res.ok) return setStatus(`Position error ${res.status}: ${data?.error || 'Failed'}`, true);
      posEl.textContent = `X: ${Number(data.x||0).toFixed(2)}, Y: ${Number(data.y||0).toFixed(2)}, Z: ${Number(data.z||0).toFixed(2)}`;
    } catch (err) {
      setStatus('Position fetch failed: ' + err, true);
    }
  }
  setInterval(fetchPosition, 1000);
  // Run both on load:
  testApi().then(fetchPosition);

  // ----- Actions -----
  async function moveCraneHome() {
    setStatus('Homing...');
    try {
      const res  = await fetch(`${API_BASE}/api/crane/home`, { method: 'POST' });
      const text = await res.text();
      if (!res.ok) return setStatus(`Home error ${res.status}: ${text || 'Failed'}`, true);
      setStatus(text || 'Crane homing started');
      fetchPosition();
    } catch (err) {
      setStatus('Network error (home): ' + err, true);
    }
  }

  async function moveCrane(command) {
    setStatus('Move ' + command + ' ...');
    try {
      const res  = await fetch(`${API_BASE}/api/crane/move`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command })
      });
      const text = await res.text();
      if (!res.ok) return setStatus(`Move error ${res.status}: ${text || 'Failed'}`, true);
      setStatus(text || ('Moved ' + command));
      fetchPosition();
    } catch (err) {
      setStatus('Network error (move): ' + err, true);
    }
  }

  async function craneFire() {
    setStatus('Fire...');
    try {
      const res = await fetch(`${API_BASE}/api/crane/fire`, { method: 'POST' });
      const text = await res.text();
      if (!res.ok) return setStatus(`Fire error ${res.status}: ${text || 'Failed'}`, true);
      setStatus(text || 'Fired');
      fetchPosition();
    } catch (err) {
      setStatus('Network error (fire): ' + err, true);
    }
  }

  async function craneRelease() {
    setStatus('Release...');
    try {
      const res = await fetch(`${API_BASE}/api/crane/release`, { method: 'POST' });
      const text = await res.text();
      if (!res.ok) return setStatus(`Release error ${res.status}: ${text || 'Failed'}`, true);
      setStatus(text || 'Released');
      fetchPosition();
    } catch (err) {
      setStatus('Network error (release): ' + err, true);
    }
  }

  // ----- Joystick (X/Y nudges) -----
  (function joystick() {
    const js  = document.getElementById('joystick');
    const box = js.parentElement;
    let dragging = false;
    let lastSent = 0;
    const THROTTLE_MS = 150;

    function center() { js.style.transform = 'translate(-50%, -50%)'; }

    box.addEventListener('mousedown', () => dragging = true);
    window.addEventListener('mouseup',  () => { dragging = false; center(); });
    box.addEventListener('mouseleave', () => { dragging = false; center(); });

    box.addEventListener('mousemove', async (e) => {
      if (!dragging) return;
      const rect = box.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dx = Math.max(-50, Math.min(50, e.clientX - cx));
      const dy = Math.max(-50, Math.min(50, e.clientY - cy));
      js.style.transform = `translate(${dx - 25}px, ${dy - 25}px)`;

      const now = Date.now();
      if (now - lastSent < THROTTLE_MS) return;
      lastSent = now;

      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'X10' : 'X-10') : (dy > 0 ? 'Y10' : 'Y-10');
      try {
        await fetch(`${API_BASE}/api/crane/move`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: dir })
        });
      } catch { /* ignore transient joystick errors */ }
    });
  })();
</script>

</body>
</html>

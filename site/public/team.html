<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>IBB Arena - Earn to Fire</title>
  <link rel="stylesheet" href="kids.css">
</head>
<body>
  <div class="topbar" id="topbar">
    <img src="assets/ibb-logo.png" alt="IBB">
    <div class="title">EARN TO FIRE</div>
  </div>

  <div class="scores" id="scores"></div>
  <div class="clock hidden" id="clock"></div>
  <div class="banner offline" id="banner">Connecting to the arena...</div>
  <div class="row cards" id="cards"></div>

  <!-- question -->
  <div class="overlay hidden" id="qbox">
    <div class="qhead" id="qhead"></div>
    <div class="question" id="qtext"></div>
    <div id="answers"></div>
    <button class="btn-plain" onclick="closeQuestion()">Back</button>
  </div>

  <!-- result -->
  <div class="overlay result hidden" id="rbox">
    <div class="big" id="rbig"></div>
    <div class="sub" id="rsub"></div>
    <div class="explain" id="rexplain"></div>
    <button class="btn-ok" onclick="closeResult()">OK</button>
  </div>

<script src="kids-common.js"></script>
<script>
  var $ = KIDS.$;
  var TEAM = KIDS.param('team');
  if (TEAM !== 'red' && TEAM !== 'blue') location.href = 'index.html';

  var current = null;      // question on screen
  var answering = false;   // stops double taps sending two answers
  var resultTimer = null;
  var last = null;         // last state from the server

  $('topbar').className = 'topbar border-' + TEAM;

  // ---------- render ----------
  function render(s) {
    last = s;
    var h = '';
    for (var i = 0; i < s.scores.length; i++) {
      var t = s.scores[i];
      h += '<div class="score team-' + t.id + (t.id === TEAM ? ' me' : '') + '">' +
           '<div class="name">' + KIDS.esc(t.name) + '</div><div class="pts">' + t.score + '</div>' +
           '<div class="split">STEM ' + t.stem + ' &middot; Bot ' + t.bot + '</div>' +
           '<div class="botst">' + (t.botsIn ? '🤖 Bots in: ' + t.botsIn + ' of ' + t.bots.length : '🕳️ ALL BOTS PITTED') + '</div></div>';
    }
    $('scores').innerHTML = h;

    var t = s.timer, ck = $('clock');
    ck.className = 'clock' + (t.running && t.left <= 10 ? ' low' : '') + (t.over ? ' over' : '');
    ck.innerHTML = t.over ? (t.reason === 'ko' ? 'KNOCKOUT!' : "TIME'S UP!") : clock(t.left);

    var b = $('banner');
    if (t.over)         { b.className = 'banner paused';   b.innerHTML = roundResult(s.scores); }
    else if (!s.gameOn) { b.className = 'banner paused';   b.innerHTML = 'PAUSED - wait for the referee'; }
    else if (s.armed)   { b.className = 'banner live';     b.innerHTML = 'ARENA LIVE - answer right to FIRE!'; }
    else                { b.className = 'banner practice'; b.innerHTML = 'PRACTICE MODE - points count, weapons are safe'; }

    var c = '';
    for (var j = 0; j < s.weapons.length; j++) {
      var w = s.weapons[j], cls = 'card', st = 'Tap to try!';
      if (w.id === 'mega') cls += ' mega';
      if (!s.gameOn || !w.enabled) { cls += ' off'; st = w.enabled ? 'Paused' : 'Switched off'; }
      else if (w.busy)   { cls += ' wait'; st = 'Recharging ' + w.busy + 's'; }
      else if (w.locked) { cls += ' wait'; st = 'Try again in ' + w.locked + 's'; }
      c += '<button class="' + cls + '" onclick="pick(\'' + w.id + '\')">' +
           '<div class="icon">' + w.icon + '</div>' +
           '<div class="label">' + KIDS.esc(w.label) + '</div>' +
           '<div class="topic">' + KIDS.esc(w.topic) + '</div>' +
           '<div class="pts">+' + w.points + ' pts</div>' +
           '<div class="status">' + st + '</div></button>';
    }
    $('cards').innerHTML = c;
  }

  function clock(secs) {
    var m = Math.floor(secs / 60), x = secs % 60;
    return m + ':' + (x < 10 ? '0' : '') + x;
  }

  function roundResult(sc) {
    if (sc[0].score === sc[1].score) return 'ROUND OVER - it is a DRAW!';
    var w = sc[0].score > sc[1].score ? sc[0] : sc[1];
    return 'ROUND OVER - ' + KIDS.esc(w.name).toUpperCase() + ' WINS!';
  }

  function poll() {
    KIDS.get('/api/kids/state?team=' + TEAM, null, function (err, s) {
      if (err) {
        var b = $('banner');
        b.className = 'banner offline';
        b.innerHTML = 'Cannot reach the arena - tell a grown-up!';
      } else {
        render(s);
      }
      setTimeout(poll, 1000);
    });
  }

  // ---------- question flow ----------
  function weapon(id) {
    if (!last) return null;
    for (var i = 0; i < last.weapons.length; i++) if (last.weapons[i].id === id) return last.weapons[i];
    return null;
  }

  function pick(id) {
    var w = weapon(id);
    if (!w || !last.gameOn || !w.enabled || w.busy || w.locked) return;
    KIDS.post('/api/kids/question', { team: TEAM, weapon: id }, null, function (err, q) {
      if (err) return flash(err.error);
      showQuestion(q);
    });
  }

  function showQuestion(q) {
    current = q;
    answering = false;
    $('qhead').innerHTML = q.icon + ' ' + KIDS.esc(q.label) + ' &middot; ' + KIDS.esc(q.topic) + ' &middot; +' + q.points + ' pts';
    $('qtext').innerHTML = KIDS.esc(q.question);
    var h = '', L = 'ABCD';
    for (var i = 0; i < q.options.length; i++) {
      h += '<button class="answer" onclick="answer(' + i + ')"><span class="letter">' + L.charAt(i) + '</span>' +
           KIDS.esc(q.options[i]) + '</button>';
    }
    $('answers').innerHTML = h;
    $('qbox').className = 'overlay';
    $('qbox').scrollTop = 0;
  }

  function closeQuestion() {
    // The server still holds the question; it simply expires. Picking again gets a new one.
    current = null;
    $('qbox').className = 'overlay hidden';
  }

  function answer(i) {
    if (!current || answering) return;
    answering = true;
    KIDS.post('/api/kids/answer', { team: TEAM, qid: current.qid, choice: i }, null, function (err, r) {
      var q = current;
      closeQuestion();
      if (err) return flash(err.error);
      showResult(q, r);
    });
  }

  function showResult(q, r) {
    var box = $('rbox');
    if (r.correct) {
      box.className = 'overlay result right';
      $('rbig').innerHTML = 'CORRECT! +' + r.points;
      var sub = {
        fired:      '🔥 FIRING ' + q.label.toUpperCase() + '! 🔥',
        practice:   'Weapon earned! (Practice mode - arena is safe)',
        banked:     'Points banked! The weapon was already recharging.',
        'hw-error': 'Points scored! (The weapon did not respond - tell a grown-up)'
      }[r.result] || '';
      $('rsub').innerHTML = sub;
    } else {
      box.className = 'overlay result wrong';
      $('rbig').innerHTML = 'Not quite!';
      $('rsub').innerHTML = 'The answer was: ' + KIDS.esc(r.answer);
    }
    $('rexplain').innerHTML = '💡 ' + KIDS.esc(r.explain);
    box.scrollTop = 0;
    clearTimeout(resultTimer);
    resultTimer = setTimeout(closeResult, 12000);
  }

  function closeResult() {
    clearTimeout(resultTimer);
    $('rbox').className = 'overlay result hidden';
  }

  function flash(msg) {
    var box = $('rbox');
    box.className = 'overlay result wrong';
    $('rbig').innerHTML = 'Hold on!';
    $('rsub').innerHTML = KIDS.esc(msg);
    $('rexplain').innerHTML = 'Pick a weapon to try again.';
    clearTimeout(resultTimer);
    resultTimer = setTimeout(closeResult, 5000);
  }

  poll();
</script>
</body>
</html>

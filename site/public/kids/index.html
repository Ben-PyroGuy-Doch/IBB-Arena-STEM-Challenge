<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Moved</title>
  <script>
    // The kids' pages moved from /kids/ to the site root (3 Oct 2026). Old bookmarks
    // (/kids/, /kids/team.html?team=red, /kids/admin.html, /kids/leaderboard.html) all land here
    // via the 404 page or directly, and are sent on with their query string intact.
    var file = location.pathname.split('/').pop() || '';
    location.replace('../' + (file === 'index.html' ? '' : file) + location.search);
  </script>
</head>

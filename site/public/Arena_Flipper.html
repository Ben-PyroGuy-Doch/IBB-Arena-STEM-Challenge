<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IBB Arena Flipper Control</title>
    <style>
      body {
        background-color: #0f0f0f;
        color: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2em;
      }
      h1 { color: #f1c40f; text-shadow: 1px 1px 4px #000; margin-bottom: 30px; }
      h2 { color: #f1c40f; }
      button {
        background-color: #e63946;
        color: #f5f5f5;
        font-size: 1.1em;
        padding: 12px 24px;
        margin: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
        transition: all 0.2s ease-in-out;
      }
      button:hover {
        background-color: #f1c40f;
        color: #0f0f0f;
        box-shadow: 0 0 15px #f1c40f;
      }
      .button-group {
        display: flex; flex-wrap: wrap; justify-content: center;
        max-width: 800px; margin: 0 auto;
      }
      .status {
        margin: 12px auto;
        max-width: 900px;
        padding: 10px 14px;
        border-radius: 8px;
        text-align: left;
        font-family: Consolas, Menlo, monospace;
        background: #1a1a1a;
        border: 1px solid #333;
        white-space: pre-wrap;
        min-height: 48px;
      }
      footer { margin-top: 40px; font-size: 0.9em; color: #888; }
      a { color: #f1c40f; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>

    <!-- Role gate -->
    <script>
      (function gate() {
        const token = sessionStorage.getItem('arenaToken');
        if (!token) location.href = 'index.html';
        try {
          const decoded = JSON.parse(atob(token));
          const expectedRole = 'flipper';
          if (decoded.role !== expectedRole) location.href = 'index.html';
        } catch {
          location.href = 'index.html';
        }
      })();
    </script>
  </head>

  <body>
    <img src="assets/ibb-logo.png" alt="IBB Logo"
         style="width: 360px; margin-bottom: 20px; filter: drop-shadow(0 0 10px #e63946);" />

    <h1>Flipper Dashboard</h1>

    <div id="status" class="status"></div>

    <div class="button-group">
      <button onclick="triggerFlipper()">Flipper</button>
    </div>

    <script>
      // ---------- CONFIG ----------
      // Your Node API is on the external network at :3000
      // If you later set up IIS reverse-proxy (/api -> localhost:3000),
      // you can set API_BASE = "" and the fetch URL will be relative.
      const API_BASE = "http://192.168.0.102:3000";

      const statusBox = document.getElementById('status');
      function setStatus(msg, isError=false) {
        statusBox.style.borderColor = isError ? '#e63946' : '#333';
        statusBox.style.color = isError ? '#e63946' : '#9ee493';
        statusBox.textContent = msg;
      }

      async function triggerFlipper() {
        setStatus("Triggering flipper...");
        try {
          const res = await fetch(`${API_BASE}/api/flipper`);
          const text = await res.text();
          if (!res.ok) {
            setStatus(`Error ${res.status}: ${text || 'Request failed'}`, true);
            return;
          }
          setStatus(text || "Flipper OK");
        } catch (err) {
          console.error(err);
          setStatus(`Network error: ${err}`, true);
        }
      }

      // Allow Enter key as alternate trigger
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") triggerFlipper();
      });
    </script>
  </body>
</html>
